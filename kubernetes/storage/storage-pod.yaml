apiVersion: v1
kind: Pod
metadata:
  name: project5-storage-test
  namespace: project5

spec:
  containers:
    - name: nginx
      image: nginx:1.29

      volumeMounts:
        - name: app-storage
          mountPath: /usr/share/nginx/html/storage

  volumes:
    - name: app-storage
      persistentVolumeClaim:
        claimName: project5-app-pvc