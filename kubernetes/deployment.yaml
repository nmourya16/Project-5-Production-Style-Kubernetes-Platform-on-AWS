apiVersion: apps/v1
kind: Deployment
metadata:
  name: project5-app
  namespace: project5
  labels:
    app: project5-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: project5-app

  template:
    metadata:
      labels:
        app: project5-app

    spec:
      serviceAccountName: project5-app-sa

      containers:
        - name: nginx
          image: nginx:1.29

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: project5-app-config

            - secretRef:
                name: project5-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"